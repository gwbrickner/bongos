# The automated half of a milestone sweep (docs/BUG_HUNTING.md §13): both build profiles, the full
# boot matrix, and the Clang static analyzer. Run it from the Actions tab ("Run workflow"), or
# push a sweep/* branch (the /milestone-sweep skill creates one).
name: milestone-sweep

on:
  push:
    branches: ['sweep/**']
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM (falls back to TCG if unavailable)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
      - name: Install dependencies
        run: sudo bash tools/ci/install-deps.sh
      - name: Format check
        run: make format-check
      - name: Host tests
        run: make host-tests
      - name: Debug build + full boot matrix
        run: make && make test-full
      - name: Static analysis
        run: make analyze
      - name: Save debug logs
        if: always()
        run: mkdir -p sweep-out && cp -r build/logs sweep-out/debug-logs 2>/dev/null; cp build/analyze/report.txt sweep-out/analyze.txt 2>/dev/null; true
      # The build doesn't track flags, so switching profiles needs a clean (docs/BUG_HUNTING.md §2).
      - name: Release build + boot matrix
        run: make clean && make RELEASE=1 && make RELEASE=1 test
      - name: Save release logs
        if: always()
        run: cp -r build/logs sweep-out/release-logs 2>/dev/null; true
      - name: Scan serial logs for failure markers
        if: always()
        run: |
          if grep -rlE 'PANIC|UBSAN|stack smashed|KTEST FAIL' sweep-out/*-logs/*.serial.log 2>/dev/null; then
            echo "::error::Failure markers found in the serial logs above"; exit 1
          fi
      - name: Upload sweep artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milestone-sweep
          path: sweep-out
