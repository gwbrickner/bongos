# boot.cfg for build/bongos-menutest.img (tests/gui/run.sh): a pinned 1024x768 resolution and a
# `timeout = forever` menu (so the screen is static until a script's `send` picks an entry) with
# three ktest=all entries, one per GUI test script (ARCHITECTURE §23, D-070).
timeout = forever
default = 1
resolution = 1024x768
kernel = /bong/kernel.elf

[Default]
cmdline = ktest=all menutest=1 ktest.shots=1

[Safe mode]
cmdline = ktest=all menutest=2 cpus=1 nomodules fbcon=on

[Serial debug]
cmdline = ktest=all menutest=3 loglevel=debug
