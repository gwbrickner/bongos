# boot.cfg for build/bongos-ktest.img (mk/image.mk, mk/test.mk): same as boot/boot.cfg, but with
# ktest=all so the kernel runs its ktests and reports through isa-debug-exit instead of idling.
# acpidump=1 (M3.1, D-169) dumps the ACPI tables on serial so `make test` can check the dump path.
kernel = /bong/kernel.elf
cmdline = ktest=all acpidump=1
