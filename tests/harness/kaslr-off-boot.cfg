# boot.cfg for build/bongos-kaslroff.img (mk/image.mk, tests/harness/kaslr-check.sh): the ktest
# config plus `kaslr = off`, so the loader must skip relocation and boot the kernel at its link
# address (slide 0). No menu entries: the GUI reference screenshots never see this image.
kernel = /bong/kernel.elf
kaslr = off
cmdline = ktest=all
