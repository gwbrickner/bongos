# Full boot matrix for `make test-full`: every configuration the current milestone verifies.
# Each row is "<firmware> <cpus> [memMiB]" (memMiB optional, default 512 -- D-084).
# Grows alongside matrix.conf as milestones land -- BIOS rows in M2.5, 4-CPU rows in M3.5 -- plus
# heavier scenarios (swap, IOMMU, extra devices) that only test-full runs.
uefi 1
# 3072 MiB: q35 splits this into RAM below and above the 4 GiB PCI hole, so this is the only row
# in the whole harness that exercises the pmm's NORMAL zone (D-084) -- the plain 512 MiB row above
# never populates it at all.
uefi 1 3072
